services:
  postgres:
    image: postgres:16-alpine
    container_name: psd_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: psdadmin
      POSTGRES_PASSWORD: psd@2024secure
      POSTGRES_DB: psd_website
    ports:
      - "5432:5432"
    volumes:
      - psd_pgdata:/var/lib/postgresql/data

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: psd_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@psdgroup.vn
      PGADMIN_DEFAULT_PASSWORD: psd@2024secure
    ports:
      - "5050:80"
    depends_on:
      - postgres

volumes:
  psd_pgdata:
